[project]
name = "spades"
version = "0.1.0"
description = "Spades+ Classic reinforcement-learning environment"
readme = "README.md"
authors = [
    { name = "vpareek2", email = "veerpareek12@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "gymnasium>=1.3.0",
    "numpy>=2.4.6",
    "pettingzoo>=1.26.1",
    "pufferlib",
    "pytest>=9.1.1",
    "ruff>=0.15.18",
]

[project.scripts]
spades = "spades:main"
spades-repl = "spades.repl:main"
spades-train-puffer = "spades.puffer:main"
spades-eval-puffer = "spades.puffer:eval_main"
spades-pretrain-puffer = "spades.puffer:pretrain_main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "PufferLib",
]

[tool.uv.sources]
pufferlib = { workspace = true, editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
exclude = ["PufferLib"]
